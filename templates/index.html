<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工资发放查询</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f5f7fa; }
  .main-card { max-width: 1400px; margin: 2rem auto; }
  .table-container { max-height: 70vh; overflow: auto; }
  .badge-status { font-size: 0.85rem; }
  .money { text-align: right; font-variant-numeric: tabular-nums; }
  #resultSection { display: none; }
  #emptyState { display: none; }
  #errorAlert { display: none; }
  .spinner-border-sm { width: 1rem; height: 1rem; }
</style>
</head>
<body>
<div class="container main-card">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">个人工资发放查询</h4>
    </div>
    <div class="card-body">
      <!-- Search form -->
      <form id="searchForm" class="row g-3 align-items-end mb-3">
        <div class="col-auto flex-grow-1">
          <label for="certInput" class="form-label">身份证号码</label>
          <input type="text" class="form-control" id="certInput" maxlength="18"
                 placeholder="请输入18位公民身份号码" autocomplete="off">
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary px-4" id="queryBtn">
            <span id="queryBtnText">查询</span>
            <span id="querySpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </div>
      </form>

      <!-- Legend -->
      <div class="alert alert-light border mb-3 py-2 px-3">
        <small class="text-muted">
          <strong>说明：</strong>发放状态留空表示该笔工资在发放批次表中无记录（未发放）。
          状态含义：0=待确认，1=确认可发放，2=已发放。
        </small>
      </div>

      <!-- Error alert -->
      <div id="errorAlert" class="alert alert-danger" role="alert"></div>

      <!-- Empty state -->
      <div id="emptyState" class="text-center text-muted py-5">
        <h5>未查询到工资记录</h5>
        <p>请检查身份证号码是否正确</p>
      </div>

      <!-- Results -->
      <div id="resultSection">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <strong id="personName"></strong>
            <span class="text-muted ms-2">身份证号：<span id="personCert"></span></span>
            <span class="text-muted ms-2">个人编号：<span id="personAac001"></span></span>
            <span class="badge bg-secondary ms-2" id="recordCount"></span>
          </div>
          <a id="exportBtn" class="btn btn-success btn-sm" href="#" target="_blank">
            导出 Excel
          </a>
        </div>
        <div class="table-container border rounded">
          <table class="table table-striped table-hover table-sm mb-0">
            <thead class="table-light sticky-top">
              <tr>
                <th>姓名</th>
                <th>个人编号</th>
                <th>员工号</th>
                <th>结算单元</th>
                <th>工资所属年月</th>
                <th>发放批次</th>
                <th class="money">本次工资总额</th>
                <th class="money">本次应发工资</th>
                <th class="money">本次实发金额</th>
                <th class="money">本次个人所得税</th>
                <th>发放状态</th>
                <th>经办年月</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const form = document.getElementById('searchForm');
const certInput = document.getElementById('certInput');
const queryBtn = document.getElementById('queryBtn');
const queryBtnText = document.getElementById('queryBtnText');
const querySpinner = document.getElementById('querySpinner');
const errorAlert = document.getElementById('errorAlert');
const emptyState = document.getElementById('emptyState');
const resultSection = document.getElementById('resultSection');
const resultBody = document.getElementById('resultBody');
const exportBtn = document.getElementById('exportBtn');

function setLoading(on) {
  queryBtn.disabled = on;
  queryBtnText.textContent = on ? '查询中...' : '查询';
  querySpinner.classList.toggle('d-none', !on);
}

function hideAll() {
  errorAlert.style.display = 'none';
  emptyState.style.display = 'none';
  resultSection.style.display = 'none';
}

function formatMoney(v) {
  if (v === null || v === undefined) return '';
  return Number(v).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function statusBadge(label) {
  if (!label) return '';
  let cls = 'bg-secondary';
  if (label === '已发放') cls = 'bg-success';
  else if (label === '确认可发放') cls = 'bg-primary';
  else if (label === '待确认') cls = 'bg-warning text-dark';
  else if (label.startsWith('部分发放')) cls = 'bg-info text-dark';
  return `<span class="badge ${cls} badge-status">${label}</span>`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAll();
  const cert = certInput.value.trim().toUpperCase();
  if (!/^[0-9]{17}[0-9X]$/.test(cert)) {
    errorAlert.textContent = '身份证号格式错误，应为18位（末位可为X）';
    errorAlert.style.display = 'block';
    return;
  }
  setLoading(true);
  try {
    const resp = await fetch(`/api/salary?cert=${encodeURIComponent(cert)}`);
    const data = await resp.json();
    if (!data.ok) {
      errorAlert.textContent = data.error || '查询失败';
      errorAlert.style.display = 'block';
      return;
    }
    if (data.count === 0) {
      emptyState.style.display = 'block';
      return;
    }
    // Populate header
    document.getElementById('personName').textContent = data.name || '';
    document.getElementById('personCert').textContent = data.cert;
    document.getElementById('personAac001').textContent = data.aac001 ?? '';
    document.getElementById('recordCount').textContent = `共 ${data.count} 条记录`;
    exportBtn.href = `/api/salary/export?cert=${encodeURIComponent(cert)}`;

    // Populate table
    resultBody.innerHTML = '';
    for (const r of data.rows) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.AAC003 ?? ''}</td>
        <td>${r.AAC001 ?? ''}</td>
        <td>${r.AAE00B ?? ''}</td>
        <td>${r.ATB931 ?? ''}</td>
        <td>${r.ATC931 ?? ''}</td>
        <td>${r.ATC937 ?? ''}</td>
        <td class="money">${formatMoney(r.ATC93AA)}</td>
        <td class="money">${formatMoney(r.ATC933)}</td>
        <td class="money">${formatMoney(r.ATC93C)}</td>
        <td class="money">${formatMoney(r.ATC93D)}</td>
        <td>${statusBadge(r.status_label)}</td>
        <td>${r.jingban_month ?? ''}</td>
      `;
      resultBody.appendChild(tr);
    }
    resultSection.style.display = 'block';
  } catch (err) {
    errorAlert.textContent = '网络错误：' + err.message;
    errorAlert.style.display = 'block';
  } finally {
    setLoading(false);
  }
});
</script>
</body>
</html>
